# Render Blueprint — FREE single web service (no card required).
#
# At low volume you don't need the worker or Redis: the webhook processes inbound
# messages INLINE whenever REDIS_URL is unset. Postgres stays on Neon (external),
# so Render bills nothing. To scale later, add the paid worker + Redis — see the
# commented block at the bottom and DEPLOY.md.
#
# Render Blueprint docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: watool-web
    runtime: node
    plan: free # free web service — spins down when idle, no card needed
    region: oregon
    buildCommand: npm ci && npm run db:generate && npm run build -w @watool/web
    startCommand: npm run start -w @watool/web
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: META_GRAPH_API_VERSION
        value: v21.0
      - key: AUTH_SECRET
        generateValue: true
      # ── set these in the dashboard ──
      - key: DATABASE_URL # Neon pooled URL (…?sslmode=require&pgbouncer=true)
        sync: false
      - key: ENCRYPTION_KEY # 32-byte hex
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY # optional (AI reply node)
        sync: false
      # NEXT_PUBLIC_* are inlined at BUILD time — set before the first deploy.
      - key: NEXT_PUBLIC_META_APP_ID # optional (Embedded Signup)
        sync: false
      - key: NEXT_PUBLIC_META_CONFIG_ID # optional (Embedded Signup)
        sync: false
    # NOTE: REDIS_URL is intentionally NOT set here — leaving it unset makes the
    # webhook process inbound inline (no worker needed). Only add it once you also
    # run the worker, or queued jobs would pile up with nothing consuming them.

